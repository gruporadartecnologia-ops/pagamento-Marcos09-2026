<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento Confirmado - Marcos Malheiro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-main: #22C55E;
            --accent-glow: rgba(34, 197, 94, 0.15);
            --accent-border: rgba(34, 197, 94, 0.3);
            --bg-dark: #0A0A0C;
            --card-bg: #141418;
            --text-primary: #FFFFFF;
            --text-secondary: #A1A1AA;
            --text-muted: #71717A;
            --border-subtle: #27272A;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image:
                radial-gradient(circle at 50% 0%, rgba(34, 197, 94, 0.08) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(34, 197, 94, 0.03) 0%, transparent 40%);
        }

        .card {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 520px;
            border-radius: 20px;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7), 0 0 30px var(--accent-glow);
            overflow: hidden;
            position: relative;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, #22C55E, #86EFAC, #22C55E);
        }

        .card-header { padding: 36px 24px 20px 24px; text-align: center; position: relative; }

        .check-circle {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid var(--accent-border);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px auto;
        }

        .badge-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid var(--accent-border);
            color: var(--accent-main);
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .badge-status::before {
            content: '';
            width: 6px; height: 6px;
            background-color: var(--accent-main);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-main);
        }

        .card-header h1 { font-size: 22px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.5px; margin-bottom: 6px; }
        .card-header p { font-size: 14px; color: var(--text-secondary); }

        .card-body { padding: 0 24px 28px 24px; }

        .amount-box {
            background: linear-gradient(180deg, rgba(34, 197, 94, 0.05) 0%, rgba(34, 197, 94, 0.01) 100%);
            border: 1px solid var(--accent-border);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 24px;
        }

        .amount-label { font-size: 12px; color: var(--text-secondary); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .amount-value { font-size: 36px; font-weight: 800; color: var(--accent-main); letter-spacing: -1px; }

        .info-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 16px;
        }

        .info-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        .info-row .label { color: var(--text-muted); font-weight: 500; }
        .info-row .val { color: var(--text-primary); font-weight: 600; text-align: right; }
        .info-row .val-mono { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-secondary); }

        .btn-action {
            width: 100%;
            margin-top: 8px;
            background-color: var(--accent-main);
            color: #000000;
            border: none;
            border-radius: 10px;
            padding: 14px 16px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.2);
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-action:hover, .btn-action:active { background-color: #4ade80; transform: translateY(-1px); }

        .card-footer {
            padding: 16px 24px;
            background-color: rgba(0, 0, 0, 0.2);
            border-top: 1px solid var(--border-subtle);
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="card-header">
            <div class="check-circle">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#22C55E" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
            <div class="badge-status">Pagamento Confirmado</div>
            <h1>Fatura Paga com Sucesso</h1>
            <p>Obrigado por regularizar sua fatura!</p>
        </div>

        <div class="card-body">
            <div class="amount-box">
                <div class="amount-label">Valor Pago</div>
                <div class="amount-value">R$ 109,99</div>
            </div>

            <div class="info-grid">
                <div class="info-row">
                    <span class="label">Pagador</span>
                    <span class="val">Marcos Malheiro</span>
                </div>
                <div class="info-row">
                    <span class="label">Assinatura</span>
                    <span class="val val-mono">30012026-011627</span>
                </div>
                <div class="info-row">
                    <span class="label">Status</span>
                    <span class="val" style="color: var(--accent-main);">Pago</span>
                </div>
            </div>

            <a class="btn-action" href="https://radarfibra.gerenciaprovedor.com.br/areadocliente" target="_blank" rel="noopener">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 4h16v16H4z"></path><line x1="4" y1="9" x2="20" y2="9"></line><line x1="9" y1="9" x2="9" y2="20"></line></svg>
                Ver Histórico na Área do Cliente
            </a>
        </div>

        <div class="card-footer">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            Ambiente seguro para visualização de pagamento
        </div>
    </div>

</body>
</html>
